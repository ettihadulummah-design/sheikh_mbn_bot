name: Binance Spot Scanner

on:
  schedule:
    # GitHub Actions uses UTC. Runs every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-spot-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only scanner
        env:
          CAPITAL_USDT: "300"
          RISK_FRACTION: "0.01"
          MAX_POSITION_FRACTION: "0.20"
          MAX_POSITIONS: "3"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Publish latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Binance scanner report"
            git push
          fi
